name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-matrix:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'src/RazorFormatter.VSCode/package.json'

      - name: Restore Solution
        run: dotnet restore RazorFormatter.slnx

      - name: Build Solution
        run: dotnet build RazorFormatter.slnx --configuration Release --no-restore

      - name: Run Test Suite
        run: dotnet test RazorFormatter.slnx --configuration Release --no-build --logger "console;verbosity=normal"

  package-artifacts:
    name: Package Tool & Extension Artifacts
    needs: test-matrix
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package .NET Global Tool
        run: dotnet pack src/RazorFormatter.Cli/RazorFormatter.Cli.csproj --configuration Release --output artifacts/tool

      - name: Package VS Code Extension
        working-directory: src/RazorFormatter.VSCode
        run: |
          npm ci
          npm run build
          npx @vscode/vsce package --no-dependencies -o ../../artifacts/vsix/razor-code-formatter.vsix

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-artifacts
          path: |
            artifacts/tool/*.nupkg
            artifacts/vsix/*.vsix
